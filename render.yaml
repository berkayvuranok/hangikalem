services:
  - type: web
    name: hangikalem
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hangikalem-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          name: hangikalem
          type: web
          property: host
      - key: ENV
        value: production
      - key: PORT
        value: "8080"
      - key: STATIC_DIR
        value: /app/static

databases:
  - name: hangikalem-db
    plan: free
